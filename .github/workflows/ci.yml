name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Type Check & Lint
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w packages/types
          npm run build -w packages/utils
          cd packages/upload-utils && npx tsc --module commonjs --moduleResolution node && cd ../..
          npm run build -w packages/api-client

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Type Check
        run: npm run type-check
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web
        continue-on-error: true

  # Job 2: Unit & Integration Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w packages/types
          npm run build -w packages/utils
          cd packages/upload-utils && npx tsc --module commonjs --moduleResolution node && cd ../..
          npm run build -w packages/api-client

      - name: Fix platform-specific native modules
        # sharp's Linux binary is needed by the image-orientation unit test
        run: npm install --no-save @rollup/rollup-linux-x64-gnu @img/sharp-linux-x64@0.34.5

      - name: Run Unit Tests
        run: npm run test:run
        working-directory: apps/web

  # Job 3: E2E Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w packages/types
          npm run build -w packages/utils
          cd packages/upload-utils && npx tsc --module commonjs --moduleResolution node && \
            node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.exports;delete p.module;fs.writeFileSync('package.json',JSON.stringify(p,null,2))" && cd ../..
          npm run build -w packages/api-client

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Fix platform-specific native modules
        run: npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu @rollup/rollup-linux-x64-gnu @img/sharp-linux-x64

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Application
        run: npm run build
        working-directory: apps/web
        env:
          SKIP_ENV_VALIDATION: true
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3333
          NEXT_PUBLIC_API_URL: http://localhost:5000

      - name: Copy static assets for standalone build
        run: |
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public || true
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static || true

      - name: Run E2E Tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          CI: true
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3333

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # Job 4: Build Check
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w packages/types
          npm run build -w packages/utils
          cd packages/upload-utils && npx tsc --module commonjs --moduleResolution node && cd ../..
          npm run build -w packages/api-client
        env:
          SKIP_ENV_VALIDATION: true

  # Job 5: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # Pinned to a release rather than @main: an unpinned mutable branch means
      # whatever lands upstream runs in CI with access to this repo.
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified
        continue-on-error: true

  # Job 6: Deploy to Production (only on push to main)
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # `build` only compiles packages/* — it neither builds the web app nor runs
    # a single test, so on its own it gated nothing. quality (type-check) matters
    # especially because next.config sets typescript.ignoreBuildErrors, so the
    # Docker build will happily ship type errors if nothing checks them first.
    # e2e is deliberately excluded: it is slow and occasionally flaky, and a
    # flaky test blocking a hotfix is its own outage. Add it here if you'd
    # rather trade deploy speed for that coverage.
    needs: [quality, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Two pushes in quick succession would otherwise SSH into the same host and
    # run docker compose concurrently. Queue instead of cancelling — cancelling
    # mid-swap is how you get a half-deployed box.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Web image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.thulobazaar.com.np \
            --build-arg NEXT_PUBLIC_SITE_URL=https://thulobazaar.com.np \
            --build-arg NEXT_PUBLIC_API_HOSTNAME=api.thulobazaar.com.np \
            --build-arg NEXT_PUBLIC_BUILD_ID="$IMAGE_TAG" \
            -t "$ECR_REGISTRY/thulobazaar-web:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/thulobazaar-web:latest" .
          docker push "$ECR_REGISTRY/thulobazaar-web" --all-tags

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -f apps/api/Dockerfile \
            -t "$ECR_REGISTRY/thulobazaar-api:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/thulobazaar-api:latest" .
          docker push "$ECR_REGISTRY/thulobazaar-api" --all-tags

      # Server-side config (compose file, nginx.conf) lives on the EC2 host and
      # used to be updated by hand, so the repo and the running config drifted
      # silently. Upload to a staging dir; the deploy step validates and swaps
      # it in. .env is deliberately NOT synced — it holds secrets and stays
      # server-managed.
      - name: Upload server config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/opt/thulobazaar/.deploy-incoming"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          script: |
            set -e
            cd /opt/thulobazaar

            # ---- Sync server config from the repo -------------------------
            INCOMING=.deploy-incoming
            STAMP=$(date +%Y%m%d-%H%M%S)

            # Refuse to touch live config if the upload was partial — half-synced
            # config is worse than stale config.
            if [ ! -f "$INCOMING/docker-compose.prod.yml" ] || [ ! -f "$INCOMING/nginx/nginx.conf" ]; then
              echo "ERROR: config upload incomplete — aborting before touching live config"
              exit 1
            fi

            # Keep a timestamped backup so a bad config can be restored by hand.
            mkdir -p .deploy-backups
            cp docker-compose.prod.yml ".deploy-backups/docker-compose.prod.yml.$STAMP" || true
            cp nginx/nginx.conf ".deploy-backups/nginx.conf.$STAMP" || true

            # Only reload nginx when its config actually changed — an
            # unnecessary reload is cheap but a needless risk.
            NGINX_CHANGED=0
            if ! cmp -s "$INCOMING/nginx/nginx.conf" nginx/nginx.conf; then
              NGINX_CHANGED=1
            fi

            cp "$INCOMING/docker-compose.prod.yml" docker-compose.prod.yml
            cp "$INCOMING/nginx/nginx.conf" nginx/nginx.conf
            rm -rf "$INCOMING"

            # Every command below depends on this file, so validate it before
            # any of them run. nginx.conf is validated later, once its container
            # is available to check it.
            if ! docker compose -f docker-compose.prod.yml config -q; then
              echo "ERROR: docker-compose.prod.yml invalid — restoring previous and aborting"
              cp ".deploy-backups/docker-compose.prod.yml.$STAMP" docker-compose.prod.yml
              exit 1
            fi
            # ---------------------------------------------------------------

            # ---- Reclaim disk before pulling -------------------------------
            # Images are built with --no-cache, so every deploy leaves a full
            # unshared image set behind. The root volume has twice filled to
            # ~97% and killed a deploy with "no space left on device" during
            # layer extract. Prune ahead of the pull rather than after the
            # failure.
            DISK_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "Disk usage before prune: ${DISK_PCT}%"
            if [ "$DISK_PCT" -ge 70 ]; then
              # Keep the last 48h of images so a recent version is still
              # available to roll back to locally. Running containers' images
              # are never removed by prune.
              docker image prune -af --filter "until=48h" || true
              docker builder prune -af || true
              DISK_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
              echo "Disk usage after timed prune: ${DISK_PCT}%"
            fi
            if [ "$DISK_PCT" -ge 85 ]; then
              # Still tight — drop every image not backing a running container.
              # Everything is re-pullable from ECR.
              echo "Still above 85%, pruning all unused images"
              docker image prune -af || true
              echo "Disk usage after full prune: $(df --output=pcent / | tail -1 | tr -dc '0-9')%"
            fi
            # ----------------------------------------------------------------

            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull web api nginx

            # ---- Database backup BEFORE migrations ------------------------
            # Hard rule: never run `migrate deploy` without a restorable dump.
            # pg_dump runs inside the postgres container (its port is not
            # host-published) using the container's own credentials env.
            # Custom format (-Fc) restores with:
            #   docker compose -f docker-compose.prod.yml exec -T postgres \
            #     pg_restore -U thulobazaar -d thulobazaar --clean < dump
            echo "Backing up production database"
            mkdir -p db-backups
            docker compose -f docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
              > "db-backups/thulobazaar_prod_$STAMP.dump"
            # An empty dump means the backup silently failed — abort the deploy.
            if [ ! -s "db-backups/thulobazaar_prod_$STAMP.dump" ]; then
              echo "ERROR: database backup is empty — aborting deploy"
              exit 1
            fi
            # Keep the newest 14 dumps so the disk doesn't fill over time.
            ls -1t db-backups/thulobazaar_prod_*.dump 2>/dev/null | tail -n +15 | xargs -r rm --
            echo "DB backup saved: db-backups/thulobazaar_prod_$STAMP.dump ($(du -h "db-backups/thulobazaar_prod_$STAMP.dump" | cut -f1))"
            # ---------------------------------------------------------------

            # Migrate BEFORE the new containers take traffic.
            # Ordering matters: the currently-running API is the OLD image and
            # does not contain the new migration files, so this uses a throwaway
            # container built from the image just pulled. `--no-deps` keeps it
            # from touching the running services.
            # Running this after `up -d` (the obvious placement) would put new
            # code in front of users against an un-migrated schema; if the
            # migration then failed, the site would already be broken. Here, a
            # failed migration aborts under `set -e` with the old code still
            # serving happily against the old schema.
            # `migrate deploy` only applies migrations already committed to the
            # repo — it never generates or infers one, and never drops data the
            # way `db push` can. Must run from packages/database so
            # prisma.config.ts is picked up.
            echo "Applying database migrations"
            docker compose -f docker-compose.prod.yml run --rm --no-deps api \
              sh -c "cd packages/database && npx prisma migrate deploy"

            # --wait blocks until both containers report healthy, so the health
            # checks below test the NEW build rather than whatever was still
            # answering. start_period (40s) covers Next.js boot.
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 180 web api
            # NOTE: nginx is deliberately NOT restarted. nginx.conf resolves the
            # upstream through a variable + `resolver 127.0.0.11 valid=2s`, so it
            # picks up the recreated container's new IP on its own within ~2s.
            # Restarting it only dropped in-flight connections and added downtime.

            # Apply nginx config changes with a reload, never a restart: reload
            # re-reads config without dropping in-flight connections. Validate
            # first — shipping a broken nginx.conf would take the site down, so
            # a failed check restores the previous file and aborts the deploy.
            if [ "$NGINX_CHANGED" = "1" ]; then
              echo "nginx.conf changed — validating before reload"
              if docker compose -f docker-compose.prod.yml exec -T nginx nginx -t; then
                docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
                echo "nginx reloaded"
              else
                echo "ERROR: nginx config invalid — restoring previous and aborting"
                cp ".deploy-backups/nginx.conf.$STAMP" nginx/nginx.conf
                exit 1
              fi
            fi

            # Reclaim disk. Plain `prune -f` only removes *dangling* images, but
            # every build is tagged with the commit SHA, so old images were never
            # dangling and accumulated forever — two per deploy, on a box that
            # also does --no-cache rebuilds. The 168h window keeps roughly a
            # week of images available as rollback targets.
            # Placed here so cleanup still happens if a later step fails.
            docker image prune -af --filter "until=168h"

            # These are the only true end-to-end checks in the pipeline. They
            # previously ended in `|| echo "WARNING..."`, which turned a failure
            # into a passing job — the deploy went green with the site down.
            curl --fail --retry 3 --retry-delay 5 http://127.0.0.1:80
            curl --fail --retry 3 --retry-delay 5 -H "Host: api.thulobazaar.com.np" http://127.0.0.1:80/api/health
        env:
          # Same value the build steps pushed to. Previously this read
          # secrets.ECR_REGISTRY while the builds used the ecr-login output — if
          # those ever drifted, images would be pushed to one registry and
          # pulled from another, and the deploy would "succeed" while changing
          # nothing.
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
